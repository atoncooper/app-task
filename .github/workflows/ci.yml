name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Gofmt check
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test -count=1 ./...

      - name: Build
        run: go build -trimpath -ldflags="-s -w" -o /tmp/app-task .
